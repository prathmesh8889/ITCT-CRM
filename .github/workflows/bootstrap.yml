name: Bootstrap verified ITCT CRM source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct corrected project
        shell: bash
        run: |
          cat .bootstrap/part-* | tr -d '\n\r' | base64 -d > /tmp/itct-crm.tar.gz
          mkdir -p /tmp/itct-crm
          tar -xzf /tmp/itct-crm.tar.gz -C /tmp/itct-crm
          cp -a /tmp/itct-crm/. ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify frontend
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Verify backend
        shell: bash
        working-directory: backend
        run: |
          npm install
          npm test

      - name: Commit complete verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Restore complete verified ITCT CRM source"
          git push origin HEAD:main

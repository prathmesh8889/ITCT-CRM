name: Bootstrap verified ITCT CRM source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-commit-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct corrected project
        shell: bash
        run: |
          cat .bootstrap/part-* | tr -d '\n\r' | base64 -d > /tmp/itct-crm.tar.gz
          gzip -t /tmp/itct-crm.tar.gz
          mkdir -p /tmp/itct-crm
          tar -xzf /tmp/itct-crm.tar.gz -C /tmp/itct-crm
          cp -a /tmp/itct-crm/. ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit complete source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete corrected ITCT CRM source"
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify frontend
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Verify backend
        shell: bash
        working-directory: backend
        run: |
          timeout 240 npm install --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
          timeout 90 npm test
